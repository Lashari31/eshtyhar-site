<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff66c4"/>
      <stop offset="100%" style="stop-color:#b7d42a"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Bold "E" lettermark -->
  <text x="10" y="48" font-family="Arial Black, sans-serif" font-weight="900"
        font-size="46" fill="#ffffff" letter-spacing="-2">E</text>
  <!-- Accent gradient bar at bottom -->
  <rect x="10" y="54" width="44" height="4" rx="2" fill="url(#bar)"/>
</svg>
